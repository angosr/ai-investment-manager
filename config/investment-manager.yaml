shadow:
  version: shadow-simulation-v2
  initial_quote_balance: "10000"
  analysis_deadline_seconds: 900

information:
  version: information-intake-v47
  normalizer_version: trendradar-collector-v12
  trendradar_mcp_url: http://127.0.0.1:3333/mcp
  newsnow_base_url: http://127.0.0.1:4444
  # 只直连 NewsNow 中原生 2 分钟刷新源；其余广覆盖来源仍由 TrendRadar 聚合。
  newsnow_sources: [mktnews-flash, fastbull-express]
  source_timezone: Asia/Shanghai
  platforms: []
  read_limit: 100
  request_timeout_seconds: 15
  collection_interval_seconds: 60
  official_event_feeds:
    - stream_id: cftc-press-releases
      url: https://www.cftc.gov/RSS/RSSGP/rssgp.xml
      entry_path_pattern: "^/PressRoom/PressReleases/[0-9]+-[0-9]{2}$"
    - stream_id: cftc-speeches-testimony
      url: https://www.cftc.gov/RSS/RSSST/rssst.xml
      entry_path_pattern: "^/PressRoom/SpeechesTestimony/[A-Za-z0-9_-]+$"
    - stream_id: fed-speeches
      url: https://www.federalreserve.gov/feeds/speeches.xml
      entry_path_pattern: "^/newsevents/speech/[a-z0-9]+\\.htm$"
      immediate_review_eligible: true
    - stream_id: fed-testimony
      url: https://www.federalreserve.gov/feeds/testimony.xml
      entry_path_pattern: "^/newsevents/testimony/[a-z0-9]+\\.htm$"
      immediate_review_eligible: true
    - stream_id: sec-press-releases
      url: https://www.sec.gov/news/pressreleases.rss
      entry_path_pattern: "^/newsroom/press-releases/[a-z0-9-]+$"
    - stream_id: sec-speeches-statements
      url: https://www.sec.gov/news/speeches-statements.rss
      entry_path_pattern: "^/newsroom/speeches-statements/[a-z0-9-]+$"
  official_publication_feeds:
    - stream_id: ofac-recent-actions
      index_url: https://ofac.treasury.gov/recent-actions
      entry_path_pattern: "^/recent-actions/20[0-9]{6}$"
      domain: REGULATION_LEGISLATION
      maximum_entries: 10
    - stream_id: treasury-press-releases
      index_url: https://home.treasury.gov/news/press-releases
      entry_path_pattern: "^/news/press-releases/[a-z]{2}[0-9]+$"
      domain: REGULATION_LEGISLATION
      maximum_entries: 10
  fed_monetary_poll_seconds: 15
  fed_calendar_poll_seconds: 21600
  economic_release_calendar_poll_seconds: 21600
  economic_release_actual_poll_seconds: 15
  economic_release_actual_deadline_seconds: 900
  # 覆盖发布后短时停机；窗口之外不追扫历史，也不制造补录触发风暴。
  economic_release_actual_recovery_lookback_seconds: 14400
  treasury_buyback_poll_seconds: 21600
  treasury_buyback_result_lookback_seconds: 604800
  regulatory_poll_seconds: 300
  official_metric_poll_seconds: 300
  # 日频/周频结构化状态每 6 小时复核；拍卖结果仍走 5 分钟快速组。
  official_metric_slow_poll_seconds: 21600
  etf_aggregate_flow_poll_seconds: 300
  # 每个因果领域都必须显式声明；空来源表示已知未覆盖，而不是默认为“没有事件”。
  coverage_requirements:
    - domain: FISCAL_DEBT
      required_capabilities: [AUCTION_ABSORPTION, DEBT_ISSUANCE, DEBT_REPURCHASE, DEBT_SERVICE_BURDEN, FISCAL_CALENDAR, REFINANCING_PROFILE, TREASURY_CASH]
      sources:
        - {stream_id: treasury-auction-results, capabilities: [AUCTION_ABSORPTION, DEBT_ISSUANCE], maximum_publication_age_seconds: 172800}
        - {stream_id: treasury-average-interest-cost, capabilities: [DEBT_SERVICE_BURDEN], maximum_publication_age_seconds: 2592000}
        - {stream_id: treasury-buyback-schedule, capabilities: [DEBT_REPURCHASE, FISCAL_CALENDAR], maximum_publication_age_seconds: 172800}
        - {stream_id: treasury-interest-expense, capabilities: [DEBT_SERVICE_BURDEN], maximum_publication_age_seconds: 2592000}
        - {stream_id: treasury-refinancing-profile, capabilities: [REFINANCING_PROFILE], maximum_publication_age_seconds: 2592000}
        - {stream_id: treasury-tga-balance, capabilities: [TREASURY_CASH], maximum_publication_age_seconds: 172800}
    - domain: MONETARY_INFLATION
      required_capabilities: [EMPLOYMENT_SURPRISE, INFLATION_SURPRISE, OFFICIAL_EVENT_CALENDAR, POLICY_DECISIONS, POLICY_IMPLEMENTATION]
      sources:
        - {stream_id: bea-economic-release-calendar, capabilities: [OFFICIAL_EVENT_CALENDAR], maximum_publication_age_seconds: 864000}
        - {stream_id: bls-economic-release-calendar, capabilities: [OFFICIAL_EVENT_CALENDAR], maximum_publication_age_seconds: 864000}
        - {stream_id: fed-monetary-releases, capabilities: [POLICY_DECISIONS], maximum_publication_age_seconds: 864000}
        - {stream_id: nyfed-reference-rates, capabilities: [POLICY_IMPLEMENTATION], maximum_publication_age_seconds: 864000}
        - {stream_id: nyfed-reverse-repo, capabilities: [POLICY_IMPLEMENTATION], maximum_publication_age_seconds: 864000}
        - {stream_id: nyfed-soma-holdings, capabilities: [POLICY_IMPLEMENTATION], maximum_publication_age_seconds: 864000}
    - domain: REGULATION_LEGISLATION
      required_capabilities: [AGENCY_RULEMAKING, EXECUTIVE_POLICY_ACTIONS, LEGISLATION_STATUS, OFFICIAL_EVENT_CALENDAR, SANCTIONS_ACTIONS]
      sources:
        - {stream_id: federal-register-digital-assets, capabilities: [AGENCY_RULEMAKING], maximum_publication_age_seconds: 604800}
        - {stream_id: ofac-recent-actions, capabilities: [SANCTIONS_ACTIONS], maximum_publication_age_seconds: 604800}
        - {stream_id: treasury-press-releases, capabilities: [EXECUTIVE_POLICY_ACTIONS], maximum_publication_age_seconds: 604800}
    - domain: INSTITUTIONAL_FLOWS
      # 发行人持仓与聚合净流量保持不同证据等级，不能互相冒充。
      required_capabilities: [BTC_ETF_AGGREGATE_FLOW, BTC_ETF_ARKB_HOLDINGS, BTC_ETF_BITB_HOLDINGS, BTC_ETF_IBIT_HOLDINGS, ETH_ETF_AGGREGATE_FLOW]
      sources:
        - {stream_id: ark-arkb-holdings, capabilities: [BTC_ETF_ARKB_HOLDINGS], maximum_publication_age_seconds: 345600}
        - {stream_id: bitwise-bitb-holdings, capabilities: [BTC_ETF_BITB_HOLDINGS], maximum_publication_age_seconds: 345600}
        - {stream_id: bykaranteli-etf-aggregate-flows, capabilities: [BTC_ETF_AGGREGATE_FLOW, ETH_ETF_AGGREGATE_FLOW], maximum_publication_age_seconds: 345600}
        - {stream_id: ishares-ibit-holdings, capabilities: [BTC_ETF_IBIT_HOLDINGS], maximum_publication_age_seconds: 345600}
    - domain: SPOT_DERIVATIVES
      required_capabilities: [BINANCE_PERPETUAL, BINANCE_SPOT, MULTI_VENUE_SPOT, OPTIONS_POSITIONING]
      sources:
        - {stream_id: binance-usdm-market, capabilities: [BINANCE_PERPETUAL, BINANCE_SPOT], maximum_publication_age_seconds: 900}
        - {stream_id: coinbase-spot-market, capabilities: [MULTI_VENUE_SPOT], maximum_publication_age_seconds: 900}
        - {stream_id: kraken-spot-market, capabilities: [MULTI_VENUE_SPOT], maximum_publication_age_seconds: 900}
    - domain: ONCHAIN_SUPPLY
      required_capabilities: [EXCHANGE_BALANCES, REALIZED_SUPPLY, STABLECOIN_SUPPLY]
      sources:
        - {stream_id: defillama-usd-stablecoin-supply, capabilities: [STABLECOIN_SUPPLY], maximum_publication_age_seconds: 172800}
    - domain: CROSS_ASSET_EXTERNAL
      # FRED 三项是明确标注的日频聚合证据，只用于宏观传导验证，不冒充一手或盘中行情。
      required_capabilities: [CREDIT, ENERGY, EQUITIES, GOLD, USD, UST_REAL_YIELD_CURVE, UST_YIELD_CURVE]
      sources:
        - {stream_id: fed-broad-dollar, capabilities: [USD], maximum_publication_age_seconds: 864000}
        - {stream_id: fred-sp500, capabilities: [EQUITIES], maximum_publication_age_seconds: 864000}
        - {stream_id: fred-us-high-yield-oas, capabilities: [CREDIT], maximum_publication_age_seconds: 864000}
        - {stream_id: fred-wti, capabilities: [ENERGY], maximum_publication_age_seconds: 864000}
        - {stream_id: treasury-real-yield-curve, capabilities: [UST_REAL_YIELD_CURVE], maximum_publication_age_seconds: 864000}
        - {stream_id: treasury-yield-curve, capabilities: [UST_YIELD_CURVE], maximum_publication_age_seconds: 864000}

pipeline:
  version: off-pipeline-v8

# 部署时显式登记 1–16 个目录同名账号；系统不会扫描或自动纳入其他目录。
# 真实调用保持关闭，直到至少一个启用账号完整通过登录、额度与隔离检查。
codex_runtime:
  version: codex-runtime-v11
  enabled: false
  isolation_verified: false
  binary: /usr/lib/node_modules/@openai/codex/bin/codex.js
  bundle_root: /home/aiuser/work/ttt/market-intel/.runtime/codex-runs
  expected_cli_version: codex-cli 0.150.1
  expected_binary_sha256: 134063e133f0b4244fa3b251acf973d4fe4b4aeeacbdc135211bf480f59f1477
  model: gpt-5.6-sol
  reasoning_effort: high
  maximum_prompt_characters: 16000
  # 两次真实深度分析分别在 279 秒完成、300 秒输出中被截断；420 秒保留
  # 有界完成余量，超时仍不换号或并行重跑。
  timeout_seconds: 420
  capacity_probe_timeout_seconds: 10
  capacity_ttl_seconds: 60
  transient_failure_cooldown_seconds: 300
  lease_ttl_seconds: 450
  max_account_switches: 1

assessment:
  version: context-assessment-v61
  enabled: false
  review_trigger_symbol: BTCUSDT
  mandate:
    version: primary-portfolio-mandate-v15
    analysis_scope: primary-portfolio
    question: 以点时证据维护组合级可证伪世界模型，解释外生事件经利率、美元、流动性、资金行为与市场结构传导至可交易资产的主路径和竞争路径；不为没有独立盈利证据的候选制造资本结论。
    mandate_exposures:
      - {economic_exposure: CRYPTO_NETWORK, asset: BTC}
      - {economic_exposure: INFLATION_SENSITIVE, asset: PAXG}
      - {economic_exposure: US_EQUITY, asset: SPY}
    observation_assets:
      - asset: BTC
        market_symbol: BTCUSDT
        horizons_minutes: [60, 240]
      - asset: ETH
        market_symbol: ETHUSDT
        horizons_minutes: [60, 240]
      - asset: PAXG
        market_symbol: PAXGUSDT
        horizons_minutes: [60, 240]
    # 只观察的同经济底层参照随 State 点时冻结；不能成为预测目标、资本候选或订单。
    observation_references:
      - target_asset: PAXG
        reference_instrument_key: BINANCE:TRADFI_PERPETUAL:XAUUSDT
        target_price_per_reference_price: "1"
    # 顺序是 Packet 容量不足时的因果优先级：政策与最新官方宏观结果、流动性/定价中介、资金行为、交叉验证。
    required_risk_factors: [US_MONETARY_POLICY, US_INFLATION, US_EMPLOYMENT, US_GROWTH, US_FISCAL_LIQUIDITY, US_FISCAL_CAPACITY, US_REAL_INTEREST_RATES, US_DOLLAR, US_EQUITY_RISK_APPETITE, US_HIGH_YIELD_CREDIT_RISK, CRYPTO_LIQUIDITY_CAPACITY, BTC_INSTITUTIONAL_FLOW, ETH_INSTITUTIONAL_FLOW, US_MONETARY_LIQUIDITY, US_INTEREST_RATES, US_ENERGY_INFLATION, BTC_INSTITUTIONAL_HOLDINGS, EXTERNAL_INFORMATION, MARKET_VOLATILITY]

