feature:
  version: feature-v1
  trend_threshold: "0.003"
  volatility_window: 8

decision_state:
  version: portfolio-state-v56
  analysis_scope: primary-portfolio
  official_fact_policy:
    version: official-fact-v21
    affected_assets: [BTC, ETH, PAXG]
    release_risk_factors: [US_MONETARY_POLICY]
    # 连续指标先用同源点时历史做量级归一化；阈值是可回放政策，不是散落在解析器中的常量。
    metric_minimum_history_observations: 30
    metric_candidate_absolute_percentile: "0.95"
  delta_policy:
    version: state-delta-v19
    validity_seconds: 3600
    horizons_minutes: [60, 240]
    intelligence_materiality: NORMAL
    intelligence_risk_factors: [EXTERNAL_INFORMATION]
    intelligence_reason_code: INTELLIGENCE_EVENT_INSERTED
    market_materiality: HIGH
    market_risk_factors: [MARKET_VOLATILITY]
    market_reason_code: MARKET_SHOCK_TRIGGERED
    rules:
      - fact_type: ARKB_HOLDINGS_SNAPSHOT
        materiality: HIGH
        reason_code: ARKB_HOLDINGS_REVISION
      - fact_type: BITB_HOLDINGS_SNAPSHOT
        materiality: HIGH
        reason_code: BITB_HOLDINGS_REVISION
      - fact_type: BTC_ETF_AGGREGATE_FLOW_SNAPSHOT
        materiality: HIGH
        reason_code: BTC_ETF_AGGREGATE_FLOW_REVISION
      - fact_type: ETH_ETF_AGGREGATE_FLOW_SNAPSHOT
        materiality: HIGH
        reason_code: ETH_ETF_AGGREGATE_FLOW_REVISION
      - fact_type: FED_BROAD_DOLLAR_SNAPSHOT
        materiality: HIGH
        reason_code: FED_BROAD_DOLLAR_REVISION
      - fact_type: FED_CHAIR_PUBLIC_EVENT_SCHEDULE
        materiality: NORMAL
        reason_code: FED_CHAIR_EVENT_SCHEDULE_REVISION
      - fact_type: FED_MONETARY_RELEASE
        materiality: HIGH
        reason_code: FED_RELEASE_REVISION
      - fact_type: FOMC_MEETING_SCHEDULE
        materiality: NORMAL
        reason_code: FOMC_SCHEDULE_REVISION
      - fact_type: IBIT_HOLDINGS_SNAPSHOT
        materiality: HIGH
        reason_code: IBIT_HOLDINGS_REVISION
      - fact_type: NYFED_REFERENCE_RATES_SNAPSHOT
        materiality: HIGH
        reason_code: NYFED_REFERENCE_RATES_REVISION
      - fact_type: NYFED_REVERSE_REPO_SNAPSHOT
        materiality: HIGH
        reason_code: NYFED_REVERSE_REPO_REVISION
      - fact_type: NYFED_SOMA_SNAPSHOT
        materiality: HIGH
        reason_code: NYFED_SOMA_REVISION
      - fact_type: TREASURY_BUYBACK_OPERATION_RESULT
        materiality: HIGH
        reason_code: TREASURY_BUYBACK_RESULT_REVISION
      - fact_type: TREASURY_BUYBACK_OPERATION_SCHEDULE
        materiality: NORMAL
        reason_code: TREASURY_BUYBACK_SCHEDULE_REVISION
      - fact_type: USD_STABLECOIN_SUPPLY_SNAPSHOT
        materiality: HIGH
        reason_code: USD_STABLECOIN_SUPPLY_REVISION
      - fact_type: US_CPI_RELEASE_ACTUAL
        materiality: HIGH
        reason_code: US_CPI_RELEASE_ACTUAL_REVISION
      - fact_type: US_DIGITAL_ASSET_RULEMAKING
        materiality: HIGH
        reason_code: US_DIGITAL_ASSET_RULEMAKING_REVISION
      - fact_type: US_EMPLOYMENT_RELEASE_ACTUAL
        materiality: HIGH
        reason_code: US_EMPLOYMENT_RELEASE_ACTUAL_REVISION
      - fact_type: US_EQUITY_MARKET_SNAPSHOT
        materiality: HIGH
        reason_code: US_EQUITY_MARKET_REVISION
      - fact_type: US_GDP_RELEASE_ACTUAL
        materiality: HIGH
        reason_code: US_GDP_RELEASE_ACTUAL_REVISION
      - fact_type: US_HIGH_YIELD_CREDIT_SNAPSHOT
        materiality: HIGH
        reason_code: US_HIGH_YIELD_CREDIT_REVISION
      - fact_type: US_OFFICIAL_ECONOMIC_RELEASE_SCHEDULE
        materiality: NORMAL
        reason_code: US_OFFICIAL_ECONOMIC_RELEASE_SCHEDULE_REVISION
      - fact_type: US_PCE_RELEASE_ACTUAL
        materiality: HIGH
        reason_code: US_PCE_RELEASE_ACTUAL_REVISION
      - fact_type: US_TREASURY_AUCTION_ABSORPTION_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_AUCTION_ABSORPTION_REVISION
      - fact_type: US_TREASURY_AVERAGE_INTEREST_COST_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_AVERAGE_INTEREST_COST_REVISION
      - fact_type: US_TREASURY_CASH_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_CASH_REVISION
      - fact_type: US_TREASURY_INTEREST_EXPENSE_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_INTEREST_EXPENSE_REVISION
      - fact_type: US_TREASURY_REAL_YIELD_CURVE_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_REAL_YIELD_REVISION
      - fact_type: US_TREASURY_REFINANCING_PROFILE_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_REFINANCING_PROFILE_REVISION
      - fact_type: US_TREASURY_YIELD_CURVE_SNAPSHOT
        materiality: HIGH
        reason_code: US_TREASURY_YIELD_REVISION
      - fact_type: US_WTI_OIL_SNAPSHOT
        materiality: HIGH
        reason_code: US_WTI_OIL_REVISION
  packet_policy:
    version: decision-packet-policy-v59
    schema_version: decision-packet-v21
    # 连续宏观/资金快照会先压缩为 StateFeature；这里要允许每条现役
    # 连续通道各保留一个可追溯输入，不能让同一字符预算只留下两条原文。
    maximum_facts: 20
    maximum_fact_characters: 7000
    # FOMC/财政结构化状态允许一条高密度长事实；仍禁止发送原始政策全文。
    maximum_characters_per_fact: 1200
    maximum_background_fact_distance_seconds: 172800
    maximum_calendar_context_distance_seconds: 604800
    maximum_intelligence_events: 8
    maximum_intelligence_characters: 3000
    maximum_characters_per_intelligence_event: 800
    # 低可靠聚合新闻永久入库，但不作为人工复核时的普通背景占用 AI 注意力。
    minimum_background_attention_priority: "0.80"
    minimum_background_source_reliability: "0.70"
    # AI 投影上限；固定分析指令保持短小，完整提示仍须低于 runtime 的 16K 硬上限。
    maximum_packet_characters: 12750
    maximum_market_age_seconds: 180

capital:
  version: total-portfolio-capital-v81
  enabled: false
  settlement_asset: USDT
  mandate:
    version: provisional-total-portfolio-real-growth-v2
    status: PROVISIONAL
    portfolio_id: primary
    base_currency: USDT
    objective: REAL_CAPITAL_GROWTH
    horizon_years: 5
    maximum_drawdown_fraction: "0.10"
    maximum_stress_loss_fraction: "0.10"
    maximum_gross_exposure_fraction: "1.00"
    allowed_exposures:
      - CASH
      - CRYPTO_NETWORK
      - GLOBAL_EQUITY
      - INFLATION_SENSITIVE
      - NOMINAL_RATES
      - US_EQUITY
  investable_universe:
    version: binance-shadow-investable-v9
    mandate_version: provisional-total-portfolio-real-growth-v2
    instruments:
      - instrument_key: BINANCE:TRADFI_PERPETUAL:SPYUSDT
        economic_exposure: US_EQUITY
        reference_candidate: true
      - instrument_key: BINANCE:USD_M_PERPETUAL:BTCUSDT
        economic_exposure: CRYPTO_NETWORK
        reference_candidate: false
      - instrument_key: BINANCE:USD_M_PERPETUAL:PAXGUSDT
        economic_exposure: INFLATION_SENSITIVE
        reference_candidate: false
  # Forecast 结算参考不等于账户可投资产品；Spot 只提供经济 Outcome 与市场状态。
  forecast_reference_instruments:
    - venue: BINANCE
      product: SPOT
      symbol: BTCUSDT
      base_asset: BTC
      quote_asset: USDT
      settlement_asset: USDT
      contract_multiplier: "1"
    - venue: BINANCE
      product: SPOT
      symbol: PAXGUSDT
      base_asset: PAXG
      quote_asset: USDT
      settlement_asset: USDT
      contract_multiplier: "1"
  # 候选尚无冻结的风险匹配选择制品，故拒绝用任一当前产品补成总账户基准。
  reference_policy: null
  decision:
    version: portfolio-net-edge-v17
    portfolio_id: primary
    enabled: true
    # Conservative payoff 已包含模型/映射不确定性；完整成本后为正就是唯一经济资格。
    # 以下两项是账户 gross 与单经济暴露集中度上限，不是每个候选的固定目标仓位。
    # 实际比例由费用后 Edge / 下行二阶矩连续得到，超出总上限时同比缩放。
    maximum_total_exposure_fraction: "1.00"
    maximum_single_sleeve_fraction: "0.50"
    target_validity_minutes: 30
    cost_model_version: executable-state-transition-v1
  risk:
    version: perpetual-portfolio-risk-v10
    instrument_allowlist: [BINANCE:TRADFI_PERPETUAL:SPYUSDT, BINANCE:USD_M_PERPETUAL:BTCUSDT, BINANCE:USD_M_PERPETUAL:PAXGUSDT]
    maximum_quote_age_seconds: 300
    maximum_quote_skew_seconds: 15
    maximum_account_age_seconds: 60
    maximum_drawdown_fraction: "0.05"
    maximum_gross_exposure_fraction: "1.00"
    maximum_net_delta_fraction: "1.00"
    maximum_instrument_fraction: "0.50"
    maximum_margin_fraction: "0.50"
    maximum_stress_loss_fraction: "0.05"
    maximum_spread_bps: "20"
    maximum_unhedged_fraction: "0.05"
    maximum_unhedged_seconds: 10
    reduction_authorization_seconds: 300
    kill_switch: false
  planner:
    version: perpetual-trade-planner-v7
    managed_instruments: [BINANCE:TRADFI_PERPETUAL:SPYUSDT, BINANCE:USD_M_PERPETUAL:BTCUSDT, BINANCE:USD_M_PERPETUAL:PAXGUSDT]
  execution_specs:
    - instrument:
        venue: BINANCE
        product: TRADFI_PERPETUAL
        symbol: SPYUSDT
        base_asset: SPY
        quote_asset: USDT
        settlement_asset: USDT
        contract_multiplier: "1"
        tradfi_market: EQUITY
      quantity_step: "0.01"
      minimum_order_notional: "5"
      # TradFi Perps 沿用 USDⓈ-M 普通账户非促销 taker 费率；不继承临时优惠。
      fee_bps: "5"
    - instrument:
        venue: BINANCE
        product: USD_M_PERPETUAL
        symbol: BTCUSDT
        base_asset: BTC
        quote_asset: USDT
        settlement_asset: USDT
        contract_multiplier: "1"
      quantity_step: "0.001"
      minimum_order_notional: "50"
      fee_bps: "5"
    - instrument:
        venue: BINANCE
        product: USD_M_PERPETUAL
        symbol: PAXGUSDT
        base_asset: PAXG
        quote_asset: USDT
        settlement_asset: USDT
        contract_multiplier: "1"
      quantity_step: "0.001"
      minimum_order_notional: "5"
      fee_bps: "5"
  sleeve_risk:
    version: linear-product-position-risk-v3
    basis_stress_bps: "100"
    funding_stress_bps: "30"
    execution_stress_bps: "100"
    derivative_initial_margin_fraction: "0.10"
  # 现役 72h prior/posterior 共用同一产品映射；这只授权费用后反事实评价，
  # 不给任一 Forecast producer 真实 Portfolio 权限。
  product_payoff_policies:
    - version: linear-perpetual-product-payoff-v1
      economic_exposure_id: CRYPTO_NETWORK:BTC:USDT
      instrument_keys: [BINANCE:USD_M_PERPETUAL:BTCUSDT]
      maximum_rule_age_seconds: 900
    - version: linear-perpetual-product-payoff-v1
      economic_exposure_id: INFLATION_SENSITIVE:PAXG:USDT
      instrument_keys: [BINANCE:USD_M_PERPETUAL:PAXGUSDT]
      maximum_rule_age_seconds: 900
