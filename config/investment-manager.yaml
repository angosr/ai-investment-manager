  # 只直连 NewsNow 中原生 2 分钟刷新源；其余广覆盖来源仍由 TrendRadar 聚合。
  newsnow_sources: [mktnews-flash, fastbull-express]
  source_timezone: Asia/Shanghai
  platforms: []
  read_limit: 100
  request_timeout_seconds: 15
  collection_interval_seconds: 60
  official_event_feeds:
    - stream_id: bea-economic-releases
      url: https://apps.bea.gov/rss/rss.xml
    - stream_id: cftc-press-releases
      url: https://www.cftc.gov/RSS/RSSGP/rssgp.xml
    - stream_id: cftc-speeches-testimony
      url: https://www.cftc.gov/RSS/RSSST/rssst.xml
    - stream_id: sec-press-releases
      url: https://www.sec.gov/news/pressreleases.rss
    - stream_id: sec-speeches-statements
      url: https://www.sec.gov/news/speeches-statements.rss
  fed_monetary_poll_seconds: 15
  fed_calendar_poll_seconds: 21600
  treasury_buyback_poll_seconds: 21600
  treasury_buyback_result_lookback_seconds: 604800
  regulatory_poll_seconds: 300
  official_metric_poll_seconds: 300
  official_metric_slow_poll_seconds: 900
  etf_aggregate_flow_poll_seconds: 300
  # 每个因果领域都必须显式声明；空来源表示已知未覆盖，而不是默认为“没有事件”。
  coverage_requirements:
    - domain: FISCAL_DEBT
      source_stream_ids: [treasury-auction-results, treasury-buyback-schedule, treasury-tga-balance]
      required_capabilities: [AUCTION_ABSORPTION, DEBT_ISSUANCE, DEBT_REPURCHASE, FISCAL_CALENDAR, TREASURY_CASH]
      source_capabilities:
        treasury-auction-results: [AUCTION_ABSORPTION, DEBT_ISSUANCE]
        treasury-buyback-schedule: [DEBT_REPURCHASE, FISCAL_CALENDAR]
        treasury-tga-balance: [TREASURY_CASH]
      maximum_poll_age_seconds: 900
      maximum_publication_age_seconds: 172800
    - domain: MONETARY_INFLATION
      source_stream_ids: [fed-monetary-releases, nyfed-reference-rates, nyfed-reverse-repo, nyfed-soma-holdings]
      required_capabilities: [EMPLOYMENT_SURPRISE, INFLATION_SURPRISE, POLICY_DECISIONS, POLICY_IMPLEMENTATION]
      source_capabilities:
        fed-monetary-releases: [POLICY_DECISIONS]
        nyfed-reference-rates: [POLICY_IMPLEMENTATION]
        nyfed-reverse-repo: [POLICY_IMPLEMENTATION]
        nyfed-soma-holdings: [POLICY_IMPLEMENTATION]
      maximum_poll_age_seconds: 1200
      maximum_publication_age_seconds: 864000
    - domain: REGULATION_LEGISLATION
      source_stream_ids: [federal-register-digital-assets]
      required_capabilities: [AGENCY_RULEMAKING, LEGISLATION_STATUS, OFFICIAL_EVENT_CALENDAR]
      source_capabilities:
        federal-register-digital-assets: [AGENCY_RULEMAKING]
      maximum_poll_age_seconds: 900
      maximum_publication_age_seconds: 604800
    - domain: INSTITUTIONAL_FLOWS
      # 发行人持仓与聚合净流量保持不同证据等级，不能互相冒充。
      source_stream_ids: [ark-arkb-holdings, bitwise-bitb-holdings, bykaranteli-etf-aggregate-flows, ishares-ibit-holdings]
      required_capabilities: [BTC_ETF_AGGREGATE_FLOW, BTC_ETF_ARKB_HOLDINGS, BTC_ETF_BITB_HOLDINGS, BTC_ETF_IBIT_HOLDINGS, ETH_ETF_AGGREGATE_FLOW]
      source_capabilities:
        ark-arkb-holdings: [BTC_ETF_ARKB_HOLDINGS]
        bitwise-bitb-holdings: [BTC_ETF_BITB_HOLDINGS]
        bykaranteli-etf-aggregate-flows: [BTC_ETF_AGGREGATE_FLOW, ETH_ETF_AGGREGATE_FLOW]
        ishares-ibit-holdings: [BTC_ETF_IBIT_HOLDINGS]
      maximum_poll_age_seconds: 1200
      maximum_publication_age_seconds: 345600
    - domain: SPOT_DERIVATIVES
      source_stream_ids: [binance-usdm-market]
      required_capabilities: [BINANCE_PERPETUAL, BINANCE_SPOT, MULTI_VENUE_SPOT, OPTIONS_POSITIONING]
      source_capabilities:
        binance-usdm-market: [BINANCE_PERPETUAL, BINANCE_SPOT]
      maximum_poll_age_seconds: 900
      maximum_publication_age_seconds: 900
    - domain: ONCHAIN_SUPPLY
      source_stream_ids: []
      required_capabilities: [EXCHANGE_BALANCES, REALIZED_SUPPLY, STABLECOIN_SUPPLY]
      maximum_poll_age_seconds: 300
      maximum_publication_age_seconds: 3600
    - domain: CROSS_ASSET_EXTERNAL
      # FRED 三项是明确标注的日频聚合证据，只用于宏观传导验证，不冒充一手或盘中行情。
      source_stream_ids: [fed-broad-dollar, fred-sp500, fred-us-high-yield-oas, fred-wti, treasury-yield-curve]
      required_capabilities: [CREDIT, ENERGY, EQUITIES, GOLD, USD, UST_YIELD_CURVE]
      source_capabilities:
        fed-broad-dollar: [USD]
        fred-sp500: [EQUITIES]
        fred-us-high-yield-oas: [CREDIT]
        fred-wti: [ENERGY]
        treasury-yield-curve: [UST_YIELD_CURVE]
      maximum_poll_age_seconds: 1200
      maximum_publication_age_seconds: 864000

