# 部署时显式登记 1–16 个目录同名账号；系统不会扫描或自动纳入其他目录。
# 真实调用保持关闭，直到至少一个启用账号完整通过登录、额度与隔离检查。
codex_runtime:
  version: codex-runtime-v7
  enabled: false
  isolation_verified: false
  binary: /usr/lib/node_modules/@openai/codex/bin/codex.js
  bundle_root: /home/aiuser/work/ttt/market-intel/.runtime/codex-runs
  expected_cli_version: codex-cli 0.149.0
  expected_binary_sha256: 134063e133f0b4244fa3b251acf973d4fe4b4aeeacbdc135211bf480f59f1477
  model: gpt-5.6-sol
  reasoning_effort: high
  maximum_prompt_characters: 16000
  timeout_seconds: 300
  capacity_probe_timeout_seconds: 10
  capacity_ttl_seconds: 60
  transient_failure_cooldown_seconds: 300
  lease_ttl_seconds: 330
  max_account_switches: 1

assessment:
  version: context-assessment-v34
  enabled: false
  review_trigger_symbol: BTCUSDT
  mandate:
    version: primary-portfolio-mandate-v9
    analysis_scope: primary-portfolio
    question: 以点时证据维护组合级可证伪世界模型，解释外生事件经利率、美元、流动性、资金行为与市场结构传导至可交易资产的主路径和竞争路径；不为没有独立盈利证据的候选制造资本结论。
    assets:
      - asset: BTC
        market_symbol: BTCUSDT
        horizons_minutes: [60, 240]
      - asset: ETH
        market_symbol: ETHUSDT
        horizons_minutes: [60, 240]
    # 顺序是 Packet 容量不足时的因果优先级：外生政策/流动性、定价中介、资金行为、交叉验证。
    required_risk_factors: [US_MONETARY_POLICY, US_FISCAL_LIQUIDITY, US_MONETARY_LIQUIDITY, US_INTEREST_RATES, US_DOLLAR, BTC_INSTITUTIONAL_FLOW, ETH_INSTITUTIONAL_FLOW, US_EQUITY_RISK_APPETITE, US_HIGH_YIELD_CREDIT_RISK, US_ENERGY_INFLATION, BTC_INSTITUTIONAL_HOLDINGS, EXTERNAL_INFORMATION, MARKET_VOLATILITY]

