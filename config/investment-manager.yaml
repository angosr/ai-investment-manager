    required_risk_factors: [US_MONETARY_POLICY, US_FISCAL_LIQUIDITY, US_MONETARY_LIQUIDITY, US_INTEREST_RATES, US_DOLLAR, CRYPTO_LIQUIDITY_CAPACITY, BTC_INSTITUTIONAL_FLOW, ETH_INSTITUTIONAL_FLOW, US_EQUITY_RISK_APPETITE, US_HIGH_YIELD_CREDIT_RISK, US_ENERGY_INFLATION, BTC_INSTITUTIONAL_HOLDINGS, EXTERNAL_INFORMATION, MARKET_VOLATILITY]

