extends: investment-manager.yaml

# 仅覆盖 Shadow 运行差异；研究基线仍可回放，未通过盲测的策略不进入前瞻运行。
strategy:
  enabled: false

capital:
  enabled: true
  context_forecast:
    enabled: true
  candidate_capital_authorizations:
    - version: btc-context-candidate-v5
      producer_id: codex-world-model-forecast
      producer_behavior_id: "d3b6a7e512b6b7e387e15cf5d3cbc35a4b7c9b1b47bb01e3caf29b2e19a39373"
      outcome_family_id: btc-spot-directional-4h
      hypothesis_fingerprint: "e64183df0bc320eab3a071397e4ca91bdd8853bc49cd39e5be8683f00a32cba4"
      maximum_allocation_fraction: "0.10"
      minimum_entry_net_bps: "10"
      minimum_hold_net_bps: "0"

outcome_evaluation:
  world_model_ablation:
    enabled: true

codex_runtime:
  enabled: true
  isolation_verified: true

assessment:
  enabled: true

codex_accounts:
  accounts:
    - account_id: .codex
      codex_home: /home/aiuser/.codex
      enabled: true
      capacity_weight: "1"
    - account_id: .codex2
      codex_home: /home/aiuser/.codex2
      enabled: true
      capacity_weight: "1"
    - account_id: .codex_affine_pb
      codex_home: /home/aiuser/.codex_affine_pb
      enabled: true
      capacity_weight: "1"

pipeline:
  version: world-forecast-spot-capital-shadow-v34

temporal:
  # WorldModel、Forecast 与 Capital 在同一运行事实库协作。
  namespace: shadow-world-forecast-capital-v1

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
