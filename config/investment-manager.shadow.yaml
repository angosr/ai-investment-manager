extends: investment-manager.yaml

capital:
  enabled: true
  context_forecast:
    enabled: true
  # Context 继续按同一合同生成研究 Forecast，但已结算证据不支持它新增风险。
  candidate_capital_authorizations: []

outcome_evaluation:
  world_model_ablation:
    enabled: true
  context_forecast_stability:
    enabled: true
  quant_baseline:
    enabled: true
  quant_context_posterior:
    enabled: true

codex_runtime:
  enabled: true
  isolation_verified: true

assessment:
  enabled: true

codex_accounts:
  accounts:
    - account_id: .codex
      codex_home: /home/aiuser/.codex
      enabled: true
      capacity_weight: "1"
    - account_id: .codex2
      codex_home: /home/aiuser/.codex2
      enabled: true
      capacity_weight: "1"
    - account_id: .codex_affine_pb
      codex_home: /home/aiuser/.codex_affine_pb
      enabled: true
      capacity_weight: "1"

pipeline:
  version: world-forecast-product-capital-shadow-v78

temporal:
  # WorldModel、Forecast 与 Capital 在同一运行事实库协作。
  namespace: shadow-world-forecast-capital-v1

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
