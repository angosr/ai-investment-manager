extends: investment-manager.yaml

capital:
  enabled: true
  # 当前没有通过成本下界的 Forecast producer；Capital 仅维护账户与风险事实。
  candidate_capital_authorizations: []

codex_runtime:
  enabled: true
  isolation_verified: true

assessment:
  enabled: true

outcome_evaluation:
  forecast_prior:
    enabled: true

codex_accounts:
  accounts:
    - account_id: .codex
      codex_home: /home/aiuser/.codex
      enabled: true
      capacity_weight: "1"
    - account_id: .codex2
      codex_home: /home/aiuser/.codex2
      enabled: true
      capacity_weight: "1"
    - account_id: .codex_affine_pb
      codex_home: /home/aiuser/.codex_affine_pb
      enabled: true
      capacity_weight: "1"

pipeline:
  version: world-capital-shadow-v87

temporal:
  # WorldModel、Forecast 与 Capital 在同一运行事实库协作。
  namespace: shadow-world-forecast-capital-v1

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
