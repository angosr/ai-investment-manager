extends: investment-manager.yaml

# 仅覆盖 Shadow 运行差异；研究基线仍可回放，未通过盲测的策略不进入前瞻运行。
strategy:
  enabled: false

capital:
  enabled: true
  context_forecast:
    enabled: true
  mock_candidate_authorizations:
    - version: btc-context-mock-v3
      producer_id: codex-world-model-forecast
      producer_behavior_id: "19a79396b47f7b4b1c18af29b3ea05ca6e87a3843920be573cdd35a486078eeb"
      outcome_family_id: btc-spot-directional-4h
      hypothesis_fingerprint: "60fb3594569baa887bb8c3d2cadaa787ec27865745b79a5ef736156e4e784e4e"
      maximum_allocation_fraction: "0.10"
      minimum_entry_net_bps: "10"
      minimum_hold_net_bps: "0"

codex_runtime:
  enabled: true
  isolation_verified: true

assessment:
  enabled: true

codex_accounts:
  accounts:
    - account_id: .codex
      codex_home: /home/aiuser/.codex
      enabled: true
      capacity_weight: "1"
    - account_id: .codex2
      codex_home: /home/aiuser/.codex2
      enabled: true
      capacity_weight: "1"
    - account_id: .codex_affine_pb
      codex_home: /home/aiuser/.codex_affine_pb
      enabled: true
      capacity_weight: "1"

pipeline:
  version: world-forecast-capital-shadow-v17

temporal:
  # WorldModel、Forecast 与 Capital 在同一运行事实库协作。
  namespace: shadow-world-forecast-capital-v1

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
