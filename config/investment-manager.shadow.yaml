extends: investment-manager.yaml

# 仅覆盖 Shadow 运行差异；研究基线仍可回放，未通过盲测的策略不进入前瞻运行。
strategy:
  enabled: false

capital:
  enabled: true
  context_forecast:
    enabled: true
  candidate_capital_authorizations:
    - version: btc-context-candidate-v1
      producer_id: codex-world-model-forecast
      producer_behavior_id: "456743687b2ab8be1bdb79eb49c23eb5422fddd54af600819c18b2def2426f70"
      outcome_family_id: btc-spot-directional-4h
      hypothesis_fingerprint: "d9ccc31ba7d90b84b3dc6c37f10637c698bcd91f0e4a887bff05e68493221111"
      maximum_allocation_fraction: "0.10"
      minimum_entry_net_bps: "10"
      minimum_hold_net_bps: "0"

codex_runtime:
  enabled: true
  isolation_verified: true

assessment:
  enabled: true

codex_accounts:
  accounts:
    - account_id: .codex
      codex_home: /home/aiuser/.codex
      enabled: true
      capacity_weight: "1"
    - account_id: .codex2
      codex_home: /home/aiuser/.codex2
      enabled: true
      capacity_weight: "1"
    - account_id: .codex_affine_pb
      codex_home: /home/aiuser/.codex_affine_pb
      enabled: true
      capacity_weight: "1"

pipeline:
  version: world-forecast-spot-capital-shadow-v33

temporal:
  # WorldModel、Forecast 与 Capital 在同一运行事实库协作。
  namespace: shadow-world-forecast-capital-v1

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
