extends: investment-manager.yaml

# 仅覆盖 Shadow 运行差异；研究基线仍可回放，未通过盲测的策略不进入前瞻运行。
strategy:
  enabled: false

capital:
  enabled: true
  mock_candidate_authorizations:
    - version: mock-candidate-authorization-v1
      producer_id: btc-dynamic-carry
      producer_version: dynamic-carry-point-in-time-v1
      forecast_family: delta-neutral-dynamic-carry
      hypothesis_fingerprint: 4d8e5da261910f17438bdc61e047a6c5a62bcb5ddb2b766be61eae98d04f2802
      evaluation_plan_id: capital-shadow-dynamic-v1
      valid_from: 2026-08-21T18:00:00Z
      valid_until: 2027-09-01T00:00:00Z
      maximum_allocation_fraction: "0.30"
      minimum_entry_net_bps: "5"
      minimum_hold_net_bps: "-5"

dynamic_carry_forecast:
  enabled: true

pipeline:
  version: carry-capital-shadow-v8

temporal:
  # 本配置只服务独立 Capital Shadow；冻结发布时必须与事实库一一对应。
  namespace: shadow-capital-20260821-v8

deployment:
  stage: SHADOW
  shadow_market_data_enabled: true
