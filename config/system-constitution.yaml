version: constitution-v2
objective: 在严格控制生存风险、真实成本和复杂度的前提下，验证并扩大可持续的风险调整后净收益。
immutable_rules:
  - 无论投资判断来自 AI、规则、优化器或人工，任何资本动作都必须进入同一账户一致性、风险、授权和执行链，不能因生产者身份获得旁路。
  - 现役行为只能由已发布 Release 冻结；研究与自演进只能改变未来 Release，不得在一次资本决策过程中原地改写生产行为。
  - 没有未来数据隔离、可回放事实和真实成本的收益结论无效。
  - 数据、账户、数据库或执行状态未知时不得增加风险。
  - 任何新增复杂度必须证明相对最简单替代方案的稳定净增量价值。
human_reserved_powers:
  - 修改 RiskPolicy、执行权限、Kill Switch 恢复条件和系统宪法。
  - 批准生产晋级、真实交易凭据接入和实盘风险额度。
  - 选择、登记与重新启用 Codex 账号目录白名单。
agent_forbidden_changes:
  - 修改固定回归集、盲测内容、已预注册验收条件或评估结果。
  - 直接发布、扩大权限、接触交易密钥或绕过人工批准。
  - 以失败候选为默认基线连续打补丁，或在无新证据时重复失败实验。
