extends: investment-manager.shadow.yaml

# Testnet 使用独立事实库（由 INVESTMENT_MANAGER_DATABASE_URL 指定）和 Temporal namespace。
temporal:
  namespace: testnet-20260818

# 当前 Product Capital 链只拥有 Mock Shadow 权限，不继承到真实 Testnet 下单。
capital:
  enabled: false
  context_forecast:
    enabled: false
  candidate_capital_authorizations: []

codex_runtime:
  enabled: false
  isolation_verified: false

assessment:
  enabled: false

market_data:
  version: binance-public-testnet-v3
  rest_base_url: https://testnet.binance.vision
  websocket_base_url: wss://stream.testnet.binance.vision
  perpetual_rest_base_url: https://testnet.binancefuture.com

frequency:
  version: testnet-frequency-v3
  maximum_orders_per_day: 2

risk:
  version: testnet-risk-v1
  maximum_risk_fraction: "0.001"
  maximum_total_risk_fraction: "0.005"
  maximum_position_notional: "25"
  maximum_daily_loss: "5"

execution:
  version: binance-spot-testnet-execution-v1

reconciliation:
  version: binance-spot-testnet-reconciliation-v1
  poll_seconds: 30

pipeline:
  version: testnet-programmatic-v6
  ai_mode: "OFF"

deployment:
  stage: TESTNET
  shadow_market_data_enabled: true
  testnet_order_submission_enabled: true
  live_order_submission_enabled: false
  credential_profile: env:INVESTMENT_MANAGER_BINANCE
  manual_approval_ref: user-approval-20260818
