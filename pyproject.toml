[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "investment-manager"
version = "0.1.0"
description = "可回放、证据与风险约束优先的 AI 投资管理系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.20,<1",
  "mcp==1.16.0",
  "alembic>=1.16,<2",
  "temporalio>=1.31,<2",
  "httpx>=0.28,<1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]
dashboard = [
  "starlette>=0.40,<2",
  "uvicorn>=0.30,<1",
  "psutil>=6,<8",
]
research = [
  "nautilus_trader==1.231.0",
]

[project.scripts]
investment-manager = "investment_manager.entrypoints.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_manager"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an explicitly configured isolated service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
